spring.application.name=api

# Configuração do Banco de Dados MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/labcycle_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuração do JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

api.security.token.secret=${API_SECURITY_TOKEN_SECRET:}
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://labcycle.netlify.app,https://*.ngrok-free.app,https://*.ngrok-free.dev}
